<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="racketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eaf2fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#184f95"/>
    </linearGradient>
    <radialGradient id="mountGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c07d0a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c07d0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#14130f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- throat (drawn first, fully behind the head so the ellipse hides its top seam) -->
  <path d="M 175 180 L 245 180 L 232 316 L 188 316 Z" fill="#ffffff" stroke="#14130f" stroke-width="3" filter="url(#softShadow2)"/>

  <!-- head (opaque, on top of the throat's upper portion -- no visible seam) -->
  <ellipse cx="210" cy="150" rx="118" ry="132" fill="url(#racketGrad)" stroke="#14130f" stroke-width="3" filter="url(#softShadow2)"/>
  <g stroke="#8a8779" stroke-width="0.7" opacity="0.55">
    <clipPath id="headClip"><ellipse cx="210" cy="150" rx="114" ry="128"/></clipPath>
    <g clip-path="url(#headClip)">
      <line x1="100" y1="30" x2="100" y2="270"/><line x1="130" y1="30" x2="130" y2="270"/>
      <line x1="160" y1="30" x2="160" y2="270"/><line x1="190" y1="30" x2="190" y2="270"/>
      <line x1="220" y1="30" x2="220" y2="270"/><line x1="250" y1="30" x2="250" y2="270"/>
      <line x1="280" y1="30" x2="280" y2="270"/><line x1="310" y1="30" x2="310" y2="270"/>
      <line x1="95" y1="45" x2="325" y2="45"/><line x1="95" y1="75" x2="325" y2="75"/>
      <line x1="95" y1="105" x2="325" y2="105"/><line x1="95" y1="135" x2="325" y2="135"/>
      <line x1="95" y1="165" x2="325" y2="165"/><line x1="95" y1="195" x2="325" y2="195"/>
      <line x1="95" y1="225" x2="325" y2="225"/><line x1="95" y1="255" x2="325" y2="255"/>
    </g>
  </g>

  <!-- handle (top overlaps the throat's bottom by matching width -- no seam) -->
  <rect x="188" y="310" width="44" height="202" rx="10" fill="#ffffff" stroke="#14130f" stroke-width="3" filter="url(#softShadow2)"/>
  <rect x="188" y="322" width="44" height="30" rx="8" fill="#e6e3da" opacity="0.6"/>
  <rect x="188" y="368" width="44" height="10" fill="#e6e3da" opacity="0.4"/>
  <rect x="188" y="392" width="44" height="10" fill="#e6e3da" opacity="0.4"/>
  <rect x="188" y="416" width="44" height="10" fill="#e6e3da" opacity="0.4"/>

  <!-- mount glow + sensor module -->
  <circle cx="210" cy="330" r="46" fill="url(#mountGlow)"/>
  <rect x="150" y="308" width="60" height="42" rx="9" fill="url(#accentGrad)" stroke="#184f95" stroke-width="1.5" filter="url(#softShadow2)"/>
  <text x="180" y="333" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff" font-family="ui-monospace, monospace">IMU</text>

  <line x1="150" y1="329" x2="70" y2="470" stroke="#8a8779" stroke-width="1.2"/>
  <rect x="14" y="472" width="270" height="76" rx="10" fill="#ffffff" stroke="#e6e3da" filter="url(#softShadow2)"/>
  <text x="26" y="493" font-size="11.5" font-weight="700" fill="#14130f">GY-521/MPU6050 + Seeed XIAO</text>
  <text x="26" y="510" font-size="10" fill="#5c5a52">rev2.1 design (§2.7) · TP4056 charging</text>
  <text x="26" y="530" font-size="10" fill="#c07d0a" font-weight="600">Concept placement — no physical unit mounted yet</text>
</svg>
