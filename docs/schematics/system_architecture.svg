<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#184f95"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#14130f" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8779"/>
    </marker>
    <marker id="arrowProto" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c07d0a"/>
    </marker>
    <pattern id="draft" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#efece3" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1040" height="1000" fill="url(#draft)"/>

  <!-- Stage 1: input -->
  <rect x="380" y="16" width="280" height="56" rx="14" fill="#ffffff" stroke="#e6e3da" filter="url(#cardShadow)"/>
  <text x="520" y="40" text-anchor="middle" font-size="14.5" font-weight="700" fill="#14130f">Swing video</text>
  <text x="520" y="58" text-anchor="middle" font-size="11" fill="#5c5a52" font-family="ui-monospace, monospace">webcam, front-facing</text>
  <line x1="520" y1="72" x2="520" y2="102" stroke="#8a8779" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 2: RTMPose -->
  <rect x="360" y="104" width="320" height="60" rx="14" fill="url(#accentGrad)" filter="url(#cardShadow)"/>
  <text x="520" y="130" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">RTMPose</text>
  <text x="520" y="148" text-anchor="middle" font-size="11" fill="#eaf2fc" font-family="ui-monospace, monospace">2D pose extraction (§2.2)</text>
  <line x1="520" y1="164" x2="520" y2="194" stroke="#8a8779" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 3: skeleton -->
  <rect x="330" y="196" width="380" height="60" rx="14" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6" filter="url(#cardShadow)"/>
  <text x="520" y="222" text-anchor="middle" font-size="14.5" font-weight="700" fill="#14130f">Normalized skeleton</text>
  <text x="520" y="240" text-anchor="middle" font-size="11" fill="#5c5a52" font-family="ui-monospace, monospace">COCO-17, hip-anchored, torso-scaled</text>

  <!-- fork to two classifiers -->
  <line x1="520" y1="256" x2="520" y2="278" stroke="#8a8779" stroke-width="1.6"/>
  <line x1="270" y1="278" x2="770" y2="278" stroke="#8a8779" stroke-width="1.6"/>
  <line x1="270" y1="278" x2="270" y2="300" stroke="#8a8779" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="770" y1="278" x2="770" y2="300" stroke="#8a8779" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 4: two classifiers side by side -->
  <rect x="130" y="302" width="280" height="76" rx="14" fill="#ffffff" stroke="#e6e3da" filter="url(#cardShadow)"/>
  <text x="270" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14130f">ST-GCN — stroke type</text>
  <text x="270" y="348" text-anchor="middle" font-size="17" font-weight="700" fill="#184f95" font-family="ui-monospace, monospace">81.7% ± 4.9%</text>
  <text x="270" y="366" text-anchor="middle" font-size="10" fill="#8a8779" font-family="ui-monospace, monospace">6-way, 5-fold CV · §2.3 / 3.1</text>

  <rect x="630" y="302" width="280" height="76" rx="14" fill="#ffffff" stroke="#e6e3da" filter="url(#cardShadow)"/>
  <text x="770" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14130f">ST-GCN — beginner/expert</text>
  <text x="770" y="348" text-anchor="middle" font-size="17" font-weight="700" fill="#184f95" font-family="ui-monospace, monospace">82.4% ± 3.8%</text>
  <text x="770" y="366" text-anchor="middle" font-size="10" fill="#8a8779" font-family="ui-monospace, monospace">5-fold CV · §2.4 / 3.2</text>

  <!-- converge into quality scoring -->
  <line x1="270" y1="378" x2="270" y2="396" stroke="#8a8779" stroke-width="1.6"/>
  <line x1="770" y1="378" x2="770" y2="396" stroke="#8a8779" stroke-width="1.6"/>
  <line x1="270" y1="396" x2="770" y2="396" stroke="#8a8779" stroke-width="1.6"/>
  <line x1="520" y1="396" x2="520" y2="414" stroke="#8a8779" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 5: quality scoring -->
  <rect x="330" y="416" width="380" height="66" rx="14" fill="url(#accentGrad)" filter="url(#cardShadow)"/>
  <text x="520" y="444" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">Quality scoring</text>
  <text x="520" y="462" text-anchor="middle" font-size="11" fill="#eaf2fc" font-family="ui-monospace, monospace">rule-based z-score vs. expert templates · §2.6</text>
  <line x1="520" y1="482" x2="520" y2="504" stroke="#8a8779" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 6: deviations -->
  <rect x="290" y="506" width="460" height="56" rx="12" fill="#ffffff" stroke="#e6e3da" filter="url(#cardShadow)"/>
  <text x="520" y="532" text-anchor="middle" font-size="13" font-weight="700" fill="#14130f">Per-phase / per-joint deviations</text>
  <text x="520" y="550" text-anchor="middle" font-size="11" fill="#5c5a52">+ rule-based correction suggestions</text>
  <line x1="520" y1="562" x2="520" y2="584" stroke="#8a8779" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 7: LLM explainer -->
  <rect x="330" y="586" width="380" height="70" rx="14" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6" filter="url(#cardShadow)"/>
  <text x="520" y="612" text-anchor="middle" font-size="13.5" font-weight="700" fill="#184f95">LLM explainer — optional</text>
  <text x="520" y="630" text-anchor="middle" font-size="10.5" fill="#5c5a52" font-family="ui-monospace, monospace">NVIDIA API · flagged-rows-only prompt</text>
  <text x="520" y="646" text-anchor="middle" font-size="10.5" fill="#8a8779">falls back to rule-based text above if unavailable</text>
  <line x1="520" y1="656" x2="520" y2="678" stroke="#8a8779" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stage 8: UI -->
  <rect x="380" y="680" width="280" height="60" rx="14" fill="#ffffff" stroke="#14130f" stroke-width="1.4" filter="url(#cardShadow)"/>
  <text x="520" y="706" text-anchor="middle" font-size="14.5" font-weight="700" fill="#14130f">Streamlit demo UI</text>
  <text x="520" y="724" text-anchor="middle" font-size="11" fill="#5c5a52" font-family="ui-monospace, monospace">score · table · suggestions · AI paragraph</text>

  <!-- Prototype connector: from beginner/expert box down the right margin to the panel below -->
  <path d="M 910 340 L 1000 340 L 1000 810 L 860 810" fill="none" stroke="#c07d0a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowProto)"/>
  <text x="965" y="330" text-anchor="middle" font-size="9.5" fill="#c07d0a" font-family="ui-monospace, monospace">extract_features()</text>

  <!-- Prototype panel -->
  <rect x="120" y="800" width="800" height="170" rx="16" fill="#fbf1de" stroke="#c07d0a" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="520" y="826" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1" fill="#c07d0a" font-family="ui-monospace, monospace">SENSOR-FUSION PROTOTYPE (§2.7) — NOT YET VALIDATED</text>

  <rect x="150" y="856" width="210" height="80" rx="12" fill="#ffffff" stroke="#c07d0a" stroke-width="1.3"/>
  <text x="255" y="886" text-anchor="middle" font-size="12" font-weight="700" fill="#14130f">Synthetic IMU</text>
  <text x="255" y="902" text-anchor="middle" font-size="10" fill="#5c5a52">signal (today)</text>
  <text x="255" y="920" text-anchor="middle" font-size="9" fill="#8a8779" font-family="ui-monospace, monospace">real board: rev2.1, not built</text>
  <line x1="360" y1="896" x2="404" y2="896" stroke="#c07d0a" stroke-width="1.6" marker-end="url(#arrowProto)"/>

  <rect x="406" y="856" width="200" height="80" rx="12" fill="#ffffff" stroke="#c07d0a" stroke-width="1.3"/>
  <text x="506" y="892" text-anchor="middle" font-size="12" font-weight="700" fill="#14130f">IMUEncoder</text>
  <text x="506" y="910" text-anchor="middle" font-size="9.5" fill="#8a8779" font-family="ui-monospace, monospace">1D-CNN, 6ch → 32d</text>
  <line x1="606" y1="896" x2="650" y2="896" stroke="#c07d0a" stroke-width="1.6" marker-end="url(#arrowProto)"/>

  <rect x="652" y="856" width="238" height="80" rx="12" fill="#ffffff" stroke="#c07d0a" stroke-width="1.3"/>
  <text x="771" y="892" text-anchor="middle" font-size="12" font-weight="700" fill="#14130f">Fused classifier</text>
  <text x="771" y="910" text-anchor="middle" font-size="9.5" fill="#8a8779" font-family="ui-monospace, monospace">FusedBeginnerExpertModel</text>
</svg>
